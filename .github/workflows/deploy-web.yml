# Builds the SPA and uploads dist/ to the Azure Static Web App.
#
# The VITE_ values are baked in at build time, so they live here as GitHub
# repository variables (Settings → Secrets and variables → Actions → Variables),
# not in the Static Web App's portal settings.
#
# Secret:    AZURE_STATIC_WEB_APPS_API_TOKEN  (Static Web App → Manage deployment token)
# Variables: VITE_AZURE_TENANT_ID, VITE_AZURE_CLIENT_ID, VITE_AZURE_API_SCOPE, VITE_API_BASE_URL
name: Deploy web

on:
  push:
    branches: [main]
    paths-ignore: ['server/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_AUTH_MODE: msal
          VITE_DATA_SOURCE: api
          VITE_AZURE_TENANT_ID: ${{ vars.VITE_AZURE_TENANT_ID }}
          VITE_AZURE_CLIENT_ID: ${{ vars.VITE_AZURE_CLIENT_ID }}
          VITE_AZURE_API_SCOPE: ${{ vars.VITE_AZURE_API_SCOPE }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      # Already built above, so the action only uploads dist/ (which carries
      # staticwebapp.config.json from public/).
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          api_location: ''
          skip_app_build: true
